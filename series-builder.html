<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Series Builder | HEARTH Studios</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --charcoal:#1C1A19; --bone:#F4ECE0; --bone-deep:#EADFCF; --card:#FBF7F0;
  --terracotta:#C25A3C; --ember:#E2682E; --glow:#F2B441; --ash:#8D99AE; --line:#E0D4C2;
  --rule:rgba(141,153,174,.28); --ok:#3E7A55;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --label:"Courier Prime","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bone);color:var(--charcoal);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.eyebrow{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--ember);margin:0}
[hidden]{display:none!important}

/* header */
.bar{position:sticky;top:0;z-index:5;background:var(--charcoal);color:var(--bone);
  padding:10px clamp(14px,3vw,28px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;color:var(--bone);text-decoration:none}
.brand b{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.brand span{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--glow)}
.bar select{background:#2A2725;color:var(--bone);border:1px solid #45403C;border-radius:6px;padding:6px 8px;max-width:260px}
.bar .btn{background:transparent;color:var(--bone);border-color:#45403C}
.bar .btn:hover{border-color:var(--ember);color:#fff}
.status{font-size:.8rem;color:var(--ash);min-width:10ch}

.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ember)}
.btn.primary{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.btn.primary:hover{background:var(--ember);border-color:var(--ember)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;background:var(--terracotta)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--terracotta);padding:4px 6px}
.btn.ghost:hover{color:var(--ember)}
.btn.danger{color:var(--terracotta)}

/* sign-in */
.auth{max-width:440px;margin:12vh auto;padding:32px;background:var(--card);border-top:4px solid var(--terracotta);border-radius:4px}
.auth h1{font-family:var(--display);font-size:2rem;line-height:1.1;margin:.3em 0 .4em}
.auth p{color:#4A4541}
.auth form{margin:0}
.auth input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:6px 0 14px}
.auth .msg{font-size:.92rem;margin-top:14px}

/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(16px,3vw,44px);max-width:1180px;margin:0 auto;padding:28px clamp(14px,3vw,28px) 90px}
nav.steps ol{list-style:none;margin:0;padding:0;position:sticky;top:80px}
nav.steps li button{display:grid;grid-template-columns:34px 1fr;gap:4px;width:100%;text-align:left;background:none;border:none;padding:9px 6px;border-radius:6px;cursor:pointer;align-items:start}
nav.steps li button:hover{background:var(--bone-deep)}
nav.steps li button[aria-current="step"]{background:var(--card);box-shadow:inset 3px 0 0 var(--terracotta)}
.num{font-family:var(--label);color:var(--ash)}
.sname{font-weight:600;line-height:1.3}
.sstate{display:block;font-size:.78rem;color:var(--ash);font-weight:400;margin-top:2px}
.st-prog .sstate{color:var(--ember)}
.st-done .num,.st-done .sstate{color:var(--ok)}
.st-approved .num,.st-approved .sstate{color:var(--terracotta);font-weight:600}
.overall{margin:18px 6px 0;font-size:.85rem;color:#5E5750}
.meter{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--glow);width:0;transition:width .3s}

main{min-width:0}
h1.stage{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.1;margin:.2em 0 .35em}
.purpose{max-width:66ch;margin:0 0 18px;font-size:1.05rem}
details.craft{background:var(--bone-deep);border-radius:8px;padding:12px 16px;margin:0 0 28px;max-width:74ch}
details.craft summary{cursor:pointer;font-weight:600}
details.craft ul{margin:10px 0 2px;padding-left:20px}
details.craft li{margin:6px 0}
.banner{background:var(--card);border-left:3px solid var(--ember);padding:10px 14px;border-radius:0 6px 6px 0;margin:0 0 20px;font-size:.93rem;max-width:74ch}

/* index cards */
.card{background:var(--card);border-radius:4px;border-top:3px solid var(--terracotta);box-shadow:0 0 0 1px var(--line);padding:20px clamp(14px,2.5vw,26px) 12px;margin-bottom:22px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0 0 4px}
.cardnote{color:#5E5750;font-size:.92rem;margin:0 0 12px;max-width:68ch}
.field{margin:0 0 22px}
.field label{display:block;font-weight:600;margin-bottom:2px}
.hint{color:#6A635B;font-size:.9rem;margin:0 0 8px;max-width:70ch}
textarea,input.line{width:100%;border:none;border-bottom:1px solid var(--line);background-color:transparent;resize:vertical;padding:0 2px;line-height:28px;font-size:1rem;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-attachment:local}
input.line{height:30px;background-image:none}
textarea:focus,input.line:focus{outline:none;border-bottom-color:var(--ember)}
textarea[readonly],input.line[readonly]{color:#4A4541;cursor:default}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:.82rem;color:#6A635B}
.meta .warn{color:var(--terracotta);font-weight:600}
.example{margin-top:8px;border-left:3px solid var(--glow);padding:8px 12px;background:var(--bone);font-size:.93rem;white-space:pre-wrap;border-radius:0 6px 6px 0}
.example b{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--ember);font-weight:400;margin-bottom:4px}
.group-item{border:1px dashed var(--line);border-radius:6px;padding:14px 14px 2px;margin-bottom:14px}
.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.group-head span{font-family:var(--display);font-weight:600}

.qa{border-top-color:var(--glow)}
.qa ul{list-style:none;margin:0 0 14px;padding:0}
.qa li{margin:8px 0}
.qa label{display:grid;grid-template-columns:22px 1fr;gap:8px;cursor:pointer;align-items:start}
.qa input{margin-top:5px;accent-color:var(--terracotta)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.badge{font-weight:600}
.badge.ok{color:var(--ok)} .badge.appr{color:var(--terracotta)}

.coach{border-top-color:var(--charcoal)}
.comment{border-bottom:1px solid var(--line);padding:10px 0}
.comment:last-of-type{border-bottom:none}
.comment .who{font-size:.82rem;color:#6A635B;display:flex;justify-content:space-between;gap:8px}
.comment .who b{color:var(--charcoal);font-weight:600}
.comment p{margin:4px 0 0;white-space:pre-wrap}
.coach textarea{border:1px solid var(--line);border-radius:6px;background:#fff;background-image:none;padding:8px 10px;line-height:1.5;margin-top:10px}
.empty{color:#6A635B;font-size:.92rem;margin:0}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:#6A635B}

dialog{border:none;border-top:4px solid var(--terracotta);border-radius:4px;background:var(--card);color:var(--charcoal);max-width:min(460px,92vw);padding:24px}
dialog::backdrop{background:rgba(28,26,25,.55)}
dialog h3{font-family:var(--display);font-size:1.4rem;margin:0 0 12px}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
dialog label.opt{display:grid;grid-template-columns:22px 1fr;gap:6px;margin:10px 0;cursor:pointer}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding-top:12px}
  nav.steps ol{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav.steps li{flex:0 0 auto}
  nav.steps li button{grid-template-columns:26px auto;padding:8px 10px}
  .sstate,.overall{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Sign-in -->
<section class="auth" id="authView" hidden>
  <p class="eyebrow">HEARTH members</p>
  <h1>Series Builder</h1>
  <p>Build your series from story bible to episode outlines, one stage at a time. Sign in with your Collaborator Hub email and password.</p>
  <form id="signInForm" novalidate>
    <label for="email" style="font-weight:600">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <label for="password" style="font-weight:600">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="signInBtn" type="submit">Sign in</button>
  </form>
  <p class="msg" id="authMsg" aria-live="polite"></p>
  <p style="font-size:.9rem;margin-top:18px">No account yet, or forgot your password? <a href="collab-hub.html" style="color:var(--terracotta)">Go to the Collaborator Hub</a>.</p>
</section>

<!-- App -->
<div id="appView" hidden>
<header class="bar">
  <a class="brand" href="collab-hub.html"><b>HEARTH</b><span>Series Builder</span></a>
  <label for="projSel" style="position:absolute;left:-9999px">Project</label>
  <select id="projSel"></select>
  <button class="btn" id="newBtn">New project</button>
  <button class="btn" id="exportBtn">Export</button>
  <span class="status" id="status" aria-live="polite"></span>
</header>
<div class="wrap">
  <nav class="steps" aria-label="Stages"><ol id="stepList"></ol>
    <div class="overall"><span id="overallTxt"></span><div class="meter"><i id="meterFill"></i></div></div>
  </nav>
  <main id="main"></main>
</div>
</div>

<dialog id="newDlg">
  <h3>New project</h3>
  <label for="newName" style="font-weight:600">Working title</label>
  <input id="newName" class="line" placeholder="Untitled series">
  <label class="opt"><input type="radio" name="seed" value="blank" checked><span>Blank template (worked examples still show under every field)</span></label>
  <label class="opt"><input type="radio" name="seed" value="example"><span>Copy of the I May Destroy You example, to study and mark up</span></label>
  <div class="row"><button class="btn" id="newCancel">Cancel</button><button class="btn primary" id="newCreate">Create project</button></div>
</dialog>

<script>
/* ============ CONFIG: use the same values as collab-hub.html ============ */
const SUPABASE_URL = 'https://ogxnqfensgdfjqaronsi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3VHZtT3Lyx0v0nKuvnBRIw_Rk50vquw'; // publishable key: safe in the page, data is protected by row-level security

/* ======================== TEMPLATE ======================== */
const STAGES = [
{ id:'foundation', title:'Foundation',
  purpose:'Lock what the show is before building anything on top of it. Every later stage gets checked against these answers.',
  craft:[
    'A series logline names a specific person (a flaw, not a job title), the event that starts the story, the complication, and the question the show keeps asking. Aim for 25–40 words.',
    'The series question is different from the pilot question. It should survive several seasons without being fully answered.',
    'HBO buys voice and specificity: a precise place, a precise community, and a point of view only you could bring. "Why you" matters as much as "why now."',
    'Keep comps to two titles in an "X meets Y" line. A signature device (narration, structure) gets its own sentence rather than a third comp.'
  ],
  cards:[{ title:'The pitch in miniature', fields:[
    {k:'title',label:'Working title',type:'line'},
    {k:'logline',label:'Logline',hint:'Specific protagonist + inciting event + complication + ongoing question. 25–40 words.',rows:4,words:[25,40]},
    {k:'seriesQ',label:'Series question',hint:'One question the whole series keeps asking.',rows:2},
    {k:'format',label:'Format',hint:'Runtime, episodes per season, genre.',type:'line'}
  ]},{ title:'The case for it', fields:[
    {k:'whyNow',label:'Why now',hint:'What in the culture makes this story land today?',rows:3},
    {k:'whyYou',label:'Why you',hint:'Your personal access to this world. Buyers invest in the writer as much as the idea.',rows:3},
    {k:'whyHBO',label:'Why HBO',hint:'What makes this an HBO show and not a network or streamer-generic one?',rows:3},
    {k:'comps',label:'Comps and signature device',hint:'"X meets Y," then one sentence on the device that makes it yours.',rows:3}
  ]}],
  qa:[
    'The logline names a flaw or contradiction, not just a job.',
    'The logline is 40 words or fewer and could be said out loud in one breath.',
    'The series question cannot be answered by the end of season one.',
    'Comps are two recent, successful premium titles, and the device is separate.',
    '"Why you" is specific enough that another writer could not claim it.'
  ]},
{ id:'world', title:'World and tone',
  purpose:'Define where the show lives and how it feels, so every scene you write later sounds like the same show.',
  craft:[
    'Treat the setting as a character with its own wants: neighborhoods, rituals, and textures that only exist there.',
    'A tone statement is a promise about the audience\'s experience. "Funny, then it hurts" is more useful than "dramedy."',
    'A narration device needs rules: who is writing, to whom, when it appears, and what it hides. Narration that only explains the scene wastes the device.',
    'Write down what the show never does. Those limits protect tone in the room later.'
  ],
  cards:[{ title:'Place and feel', fields:[
    {k:'setting',label:'Setting',hint:'Where, specifically, and what the place does to your protagonist.',rows:4},
    {k:'tone',label:'Tone statement',hint:'How an episode should feel to watch, in one or two sentences.',rows:3},
    {k:'look',label:'Visual and sonic language',hint:'Camera, structure, music, editing rhythm.',rows:3}
  ]},{ title:'Voice and meaning', fields:[
    {k:'narration',label:'Narration device',hint:'Source (what is he writing?), rules, and what it reveals vs. hides.',rows:4},
    {k:'themes',label:'Themes',hint:'The central theme, plus one or two secondary themes.',rows:3},
    {k:'never',label:'The show never…',hint:'Tone guardrails.',rows:3}
  ]}],
  qa:[
    'The setting could not be swapped for another city without losing story.',
    'The tone statement describes the audience experience, not a genre label.',
    'The narration has a source in the story and clear rules for when it appears.',
    'The central theme is stated as a tension or question, not a single word.',
    'There are at least two "never" guardrails.'
  ]},
{ id:'characters', title:'Characters',
  purpose:'Build people who generate story on their own. A strong ensemble makes episodes easier to write.',
  craft:[
    'Want is what the character pursues; need is what would actually heal them. Comedy and drama live in the gap between the two.',
    'The wound is the past event. The flaw is how that wound behaves in the present.',
    'Every supporting character should want something from the protagonist that conflicts with what he wants.',
    'Give each regular their own arc, even a small one. Characters who only exist to react become furniture.'
  ],
  cards:[{ title:'Protagonist', fields:[
    {k:'pName',label:'Name and age',type:'line'},
    {k:'pSnapshot',label:'Snapshot',hint:'Who he is in three sentences, including his role in his family.',rows:3},
    {k:'pWant',label:'Want',rows:2},
    {k:'pNeed',label:'Need',rows:2},
    {k:'pWound',label:'Wound',hint:'The past event or pattern.',rows:2},
    {k:'pFlaw',label:'Flaw',hint:'How the wound shows up in his behavior now.',rows:2},
    {k:'pLie',label:'What he tells himself vs. the truth',rows:2},
    {k:'pVoice',label:'Voice sample',hint:'A line only he would say.',rows:2}
  ]}],
  groups:[{ k:'cast', title:'Supporting cast', item:'Character', add:'Add character',
    note:'Start with 3–5 regulars. Add recurring characters later.',
    fields:[
      {k:'name',label:'Name and role in his life',type:'line'},
      {k:'wants',label:'What they want from him',rows:2},
      {k:'arc',label:'Their own season arc',rows:2},
      {k:'function',label:'How they test the theme',rows:2}
  ]}],
  qa:[
    'The protagonist\'s want and need point in different directions.',
    'His flaw is visible in behavior, something an actor could play.',
    'Every regular wants something from him that creates conflict.',
    'Every regular has an arc of their own.',
    'No two supporting characters serve the same function.'
  ]},
{ id:'engine', title:'Series engine',
  purpose:'Prove the show can make episodes, not just a pilot. This is the stage buyers probe hardest.',
  craft:[
    'The engine is the repeatable situation that keeps producing story. Name it in one sentence.',
    'Half-hours usually run an A story (protagonist), a B story, and sometimes a light C. Assign each lane its usual territory.',
    'If you cannot list 15–20 springboards quickly, the engine is not built yet.',
    'Decide limited or ongoing. An ongoing series needs a visible season two; a limited series (like IMDY) needs a finale that resolves.'
  ],
  cards:[{ title:'How episodes happen', fields:[
    {k:'engine',label:'The engine in one sentence',rows:2},
    {k:'shape',label:'Episode shape',hint:'The repeatable pattern most episodes follow.',rows:3},
    {k:'laneA',label:'A lane',hint:'What the A story usually carries.',rows:2},

    {k:'springboards',label:'Episode springboards',hint:'One line each. Aim for 15–20.',rows:10},

  ]}],
  qa:[
    'The engine fits in one sentence and does not depend on a gimmick.',
    'Each lane has distinct territory, and the lanes can collide.',

{ id:'arc', title:'Season arc',
  purpose:'Chart where everyone starts and ends so each episode has a job in the larger story.',
  craft:[
    'Define the protagonist\'s emotional position at the start and end first, then fill the middle.',
    'The midpoint should turn the season: a revelation or choice after which the old plan stops working.',
    'The late-season low point is where his flaw costs him the most.',
    'End the finale on a changed question, not a closed door, so season two has a way in.'
  ],
  cards:[{ title:'The spine', fields:[
    {k:'seasonQ',label:'Season question',hint:'The specific question season one asks and answers.',rows:2},
    {k:'start',label:'Where he starts',rows:2},
    {k:'end',label:'Where he ends',rows:2},
    {k:'opening',label:'Opening movement (episodes 1–3)',rows:3},
    {k:'midpoint',label:'Midpoint turn',rows:3},
    {k:'low',label:'Late-season low point',rows:3},
    {k:'finale',label:'Finale and button into season two',rows:3}
  ]}],
  groups:[{ k:'arcs', title:'Supporting arcs', item:'Arc', add:'Add arc',
    note:'One entry per regular: where they start, where they end.',
    fields:[{k:'who',label:'Character',type:'line'},{k:'from',label:'Starts',rows:2},{k:'to',label:'Ends',rows:2}]
  }],
  qa:[
    'Start and end positions are clearly different.',
    'The midpoint changes his strategy, not just his circumstances.',
    'The low point comes from his flaw, not from bad luck.',
    'Each regular\'s arc peaks in a different episode.',
    'The finale answers the season question and opens a new one.'
  ]},
{ id:'map', title:'Episode map',
  purpose:'Give every episode a one-line purpose before outlining any of them. This is the room\'s board.',
  craft:[
    'Name each episode by its question or theme. Sex and the City\'s narration often framed the episode as a question, which works well with a writing device.',
    'Check that A, B, and C stories rhyme thematically inside each episode.',
    'Track where he ends each episode emotionally. A flat line across several episodes means the arc is stalling.',
    'Place the revisits to the past deliberately so they escalate across the season.'
  ],
  groups:[{ k:'episodes', title:'Episodes', item:'Episode', add:'Add episode', start:8,
    note:'HBO half-hour seasons commonly run 8–12 episodes. IMDY ran 12.',
    fields:[
      {k:'title',label:'Title',type:'line'},
      {k:'question',label:'Episode question or theme',rows:2},
      {k:'a',label:'A story',rows:2},{k:'b',label:'B story',rows:2},{k:'c',label:'C story',rows:2},
      {k:'past',label:'Past revisit or flashback',rows:2},
      {k:'endState',label:'Where he ends emotionally',rows:2}
  ]}],
  qa:[
    'Every episode has its own question or theme.',
    'A, B, and C connect thematically in each episode.',
    'His emotional end state changes from episode to episode.',
    'The midpoint and low point from the arc land in specific episodes.',
    'The past revisits escalate in stakes across the season.'
  ]},
{ id:'outline', title:'Episode outlines',
  purpose:'Break each episode into sequences and scenes, ready for pages.',
  craft:[
    'HBO has no commercial breaks, so there are no mandatory act-outs. Structure still matters: think in five or six sequences.',
    'Half-hour scripts commonly run about 28–40 pages. Scene counts vary widely: the draft IMDY pilot has 61 scenes in 40 pages, many only a few lines long. Plan by sequence, not scene count.',

  ],
  groups:[{ k:'outlines', title:'Outlines', item:'Outline', add:'Add outline', start:1,
    note:'One outline per episode. Match the episode number from your map.',
    fields:[
      {k:'ep',label:'Episode',type:'line'},
      {k:'narrOpen',label:'Narration open',rows:2},
      {k:'cold',label:'Cold open',rows:3},

      {k:'crisis',label:'Sequence 4: crisis',rows:3},
      {k:'resolution',label:'Sequence 5: resolution and button',rows:3},
      {k:'narrClose',label:'Narration close',rows:2},
      {k:'scenes',label:'Scene list',hint:'One line per scene: location, who, what turns.',rows:8}
  ]}],
  qa:[
    'Every sequence changes the situation.',
    'The A story changes the protagonist by the end.',
    'The draft lands at roughly 28–40 pages.',
    'The narration open and close frame the episode\'s question.',

/* ======================== WORKED EXAMPLE ========================
   I May Destroy You: paraphrased analysis only, no script text.

/* Live mode needs real config + the Supabase library. Otherwise: preview mode (this browser only). */
const CONFIGURED = /^https:\/\//.test(SUPABASE_URL) && !/^YOUR_/.test(SUPABASE_ANON_KEY);
const HAS_LIB = !!(window.supabase && window.supabase.createClient);
let PREVIEW = !(CONFIGURED && HAS_LIB);
let sb;
if(!PREVIEW){ try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ PREVIEW = true; } }
if(PREVIEW){ sb = makePreviewStore(); }

function makePreviewStore(){
  const mem={};
  const load=t=>{try{return JSON.parse(localStorage.getItem('sbpreview.'+t)||'[]')}catch(e){return mem[t]||[]}};
  const save=(t,rows)=>{mem[t]=rows;try{localStorage.setItem('sbpreview.'+t,JSON.stringify(rows))}catch(e){}};
  const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
  const user={id:'preview-user',email:'preview@buildyourhearth.studio'};
  const asLead=/[?&]lead=1/.test(location.search);
  function from(t){
    const q={op:'select',vals:null,filters:[],ord:null,one:false};
    const b={
      select(){return b}, eq(c,v){q.filters.push([c,v]);return b}, single(){q.one=true;return b},
      order(c,o){q.ord=[c,!(o&&o.ascending===false)];return b},
      insert(v){q.op='insert';q.vals=v;return b}, update(v){q.op='update';q.vals=v;return b}, delete(){q.op='delete';return b},
      then(res,rej){return Promise.resolve().then(run).then(res,rej)}
    };
    const match=r=>q.filters.every(([c,v])=>r[c]===v);
    function run(){
      let rows=load(t), now=new Date().toISOString();
      if(q.op==='insert'){const r=Object.assign({id:rid(),created_at:now,updated_at:now,approved_at:now},q.vals);rows.push(r);save(t,rows);return {data:q.one?r:[r],error:null}}
      if(q.op==='update'){rows.forEach(r=>{if(match(r))Object.assign(r,q.vals,{updated_at:now})});save(t,rows);return {data:null,error:null}}
      if(q.op==='delete'){save(t,rows.filter(r=>!match(r)));return {data:null,error:null}}
      let out=rows.filter(match);
      if(q.ord){const [c,asc]=q.ord;out.sort((a,b)=>(a[c]>b[c]?1:-1)*(asc?1:-1))}
      return {data:q.one?(out[0]||null):out,error:q.one&&!out[0]?{message:'Not found'}:null};
    }
    return b;
  }
  return {
    auth:{getSession:async()=>({data:{session:{user}}}),onAuthStateChange(){},signOut:async()=>{location.reload()},signInWithPassword:async()=>({error:{message:'Preview mode'}})},
    rpc:async()=>({data:asLead,error:null}),
    from
  };
}
let me=null, isLead=false, list=[], P=null, canEdit=false, approvals={}, comments=[], stage=0;

const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wc(s){return (s||'').trim().split(/\s+/).filter(Boolean).length}
function filled(v){return typeof v==='string'&&v.trim().length>0}
function setStatus(t){$('#status').textContent=t}
function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(d){d=d||{};return {f:d.f||{},g:d.g||{},qa:d.qa||{},done:d.done||{}}}
function fmtDate(s){try{return new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}

/* ======================== AUTH ======================== */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await onSignedIn(session); else showAuth();
  sb.auth.onAuthStateChange((ev,s)=>{
    // Defer: Supabase recommends not awaiting other Supabase calls inside this callback.
    if(ev==='SIGNED_IN'&&s&&!me) setTimeout(()=>onSignedIn(s),0);
    if(ev==='SIGNED_OUT'){me=null;showAuth()}
  });
}
function showAuth(){$('#appView').hidden=true;$('#authView').hidden=false}
$('#signInForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#email').value.trim(), password=$('#password').value, msg=$('#authMsg'), btn=$('#signInBtn');
  if(!/^\S+@\S+\.\S+$/.test(email)){msg.textContent='Enter a valid email address.';return}
  if(!password){msg.textContent='Enter your password.';return}
  btn.disabled=true; msg.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;
  if(error){msg.textContent=/invalid/i.test(error.message)?'That email and password don\'t match. Check both, or reset your password in the Collaborator Hub.':'Could not sign in: '+error.message;return}
  msg.textContent=''; $('#password').value='';
  if(data&&data.session&&!me) await onSignedIn(data.session);
});

async function onSignedIn(session){
  if(me) return;
  me={id:session.user.id,email:session.user.email};
  $('#authView').hidden=true; $('#appView').hidden=false; setStatus('Loading…');
  const r=await sb.rpc('sb_is_lead'); isLead=!r.error&&r.data===true;
  await loadList();
  if(!list.some(x=>x.owner===me.id)){ await createProject('My series','blank',false); await loadList(); }
  const last=localStorage.getItem('sb.last');
  const pick=list.find(x=>x.id===last)||list.find(x=>x.owner===me.id)||list[0];
  await openProject(pick.id);
}

/* ======================== DATA ======================== */
async function loadList(){
  const {data,error}=await sb.from('sb_projects').select('id,title,owner,owner_email,updated_at').order('updated_at',{ascending:false});
  if(error){setStatus('Could not load projects');return}
  list=data||[]; renderProjects();
}
async function createProject(title,seed,open=true){
  const d=seed==='example'?{f:clone(EX.f),g:clone(EX.g),qa:{},done:{}}:{f:{},g:{},qa:{},done:{}};
  const {data,error}=await sb.from('sb_projects').insert({owner:me.id,owner_email:me.email,title:title||'Untitled series',data:d}).select('id').single();
  if(error){alert('Project not created: '+error.message);return}
  if(open){await loadList();await openProject(data.id)}
}
async function openProject(id){
  setStatus('Loading…');
  const {data,error}=await sb.from('sb_projects').select('*').eq('id',id).single();
  if(error){setStatus('Could not open project');return}
  P=data; P.data=norm(P.data); canEdit=P.owner===me.id; stage=0;
  try{localStorage.setItem('sb.last',id)}catch(e){}
  await Promise.all([loadApprovals(),loadComments()]);
  renderAll(); setStatus(canEdit?'Saved':'Viewing');
}
async function loadApprovals(){
  const {data}=await sb.from('sb_approvals').select('*').eq('project_id',P.id);
  approvals={}; (data||[]).forEach(a=>approvals[a.stage_id]=a);
}
async function loadComments(){
  const {data}=await sb.from('sb_comments').select('*').eq('project_id',P.id).order('created_at',{ascending:true});
  comments=data||[];
}

let saveTimer=null, saving=false, again=false;
function scheduleSave(){ if(!canEdit)return; setStatus('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,1200) }
async function saveNow(){
  if(saving){again=true;return}
  saving=true;
  try{localStorage.setItem('sb.backup.'+P.id,JSON.stringify({title:P.title,data:P.data,at:Date.now()}))}catch(e){}
  const {error}=await sb.from('sb_projects').update({title:P.title,data:P.data}).eq('id',P.id);
  saving=false;
  setStatus(error?'Not saved. Check your connection.':'Saved');
  if(again){again=false;saveNow()}
}
window.addEventListener('beforeunload',e=>{if(saveTimer&&$('#status').textContent==='Saving…'){e.preventDefault();e.returnValue=''}});

/* ======================== PROGRESS ======================== */
function stageFields(st){const o=[];(st.cards||[]).forEach(c=>c.fields.forEach(f=>o.push(f)));return o}
function stageState(st){
  if(approvals[st.id]) return 'approved';
  if(P.data.done[st.id]) return 'done';
  const d=P.data;
  const any=stageFields(st).some(f=>filled(d.f[f.k]))||(st.groups||[]).some(g=>(d.g[g.k]||[]).some(it=>Object.values(it).some(filled)));
  return any?'prog':'empty';
}

/* ======================== RENDER ======================== */
function renderAll(){renderProjects();renderSteps();renderMain()}
function renderProjects(){
  const sel=$('#projSel'), mine=list.filter(x=>me&&x.owner===me.id), theirs=list.filter(x=>me&&x.owner!==me.id);
  const opt=x=>`<option value="${x.id}" ${P&&x.id===P.id?'selected':''}>${esc(x.title)}${x.owner!==me.id?' | '+esc(x.owner_email||'writer'):''}</option>`;
  sel.innerHTML=isLead&&theirs.length
    ?`<optgroup label="My projects">${mine.map(opt).join('')}</optgroup><optgroup label="Writers' projects">${theirs.map(opt).join('')}</optgroup>`
    :mine.map(opt).join('');
}
function renderSteps(){
  let done=0;
  $('#stepList').innerHTML=STAGES.map((st,i)=>{
    const s=stageState(st); if(s==='done'||s==='approved')done++;
    const lbl={approved:'Approved',done:'Complete',prog:'In progress',empty:'Not started'}[s];
    return `<li class="st-${s}"><button data-step="${i}" ${i===stage?'aria-current="step"':''}>
      <span class="num">${s==='approved'||s==='done'?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="sname">${esc(st.title)}<span class="sstate">${lbl}</span></span></button></li>`;
  }).join('');
  $('#overallTxt').textContent=`${done} of ${STAGES.length} stages complete`;
  $('#meterFill').style.width=(done/STAGES.length*100)+'%';
}
function fieldHTML(f,val,exVal,attrs){
  const id='f_'+attrs.replace(/[^a-z0-9]/gi,'_'), ro=canEdit?'':'readonly';
  const input=f.type==='line'
    ?`<input class="line" id="${id}" ${attrs} ${ro} value="${esc(val)}">`
    :`<textarea id="${id}" ${attrs} ${ro} rows="${f.rows||3}">${esc(val)}</textarea>`;
  let meta='<span></span>';
  if(f.words){const n=wc(val);meta=`<span class="${n>f.words[1]?'warn':''}" data-wc>${n} words · target ${f.words[0]}–${f.words[1]}</span>`}
  const hasEx=filled(exVal);
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${f.hint?`<p class="hint">${esc(f.hint)}</p>`:''}${input}
    <div class="meta">${meta}${hasEx?'<button class="btn ghost" type="button" data-toggle-ex>Show example</button>':''}</div>
    ${hasEx?`<div class="example" hidden><b>Example: ${EX_SOURCE}</b>${esc(exVal)}</div>`:''}</div>`;
}

    if(!d.g[g.k]) d.g[g.k]=Array.from({length:g.start||1},()=>({}));
    const items=d.g[g.k], exItems=EX.g[g.k]||[];
    h+=`<section class="card"><h2>${esc(g.title)}</h2><p class="cardnote">${esc(g.note||'')}</p>`;
    items.forEach((it,i)=>{
      h+=`<div class="group-item"><div class="group-head"><span>${esc(g.item)} ${i+1}</span>
        ${canEdit?`<button class="btn ghost" type="button" data-remove="${g.k}" data-i="${i}">Remove</button>`:''}</div>`;
      g.fields.forEach(f=>{h+=fieldHTML(f,it[f.k]||'',(exItems[i]||{})[f.k],`data-g="${g.k}" data-i="${i}" data-gk="${f.k}"`)});
      h+='</div>';
    });
    if(canEdit) h+=`<button class="btn" type="button" data-add="${g.k}">${esc(g.add)}</button>`;
    h+='</section>';
  });

  const qa=d.qa[st.id]||[], all=st.qa.every((_,i)=>qa[i]);
  h+=`<section class="card qa"><h2>QA checkpoint</h2>
    <p class="cardnote">${canEdit?'Check each item honestly before marking the stage complete.':'The writer\'s self-check for this stage.'}</p>
    <ul>${st.qa.map((q,i)=>`<li><label><input type="checkbox" data-qa="${i}" ${qa[i]?'checked':''} ${canEdit?'':'disabled'}><span>${esc(q)}</span></label></li>`).join('')}</ul>
    <div class="actions">${
      d.done[st.id]
        ?`<span class="badge ok">Marked complete</span>${canEdit&&!approvals[st.id]?'<button class="btn ghost" type="button" id="undoneBtn">Reopen stage</button>':''}`
        :(canEdit?`<button class="btn primary" type="button" id="doneBtn" ${all?'':'disabled'}>Mark stage complete</button>`:'<span class="empty">Not marked complete yet.</span>')
    }</div></section>`;

  const a=approvals[st.id], cs=comments.filter(c=>c.stage_id===st.id);
  h+=`<section class="card coach"><h2>Coaching</h2>
    <div class="actions">${
      a?`<span class="badge appr">Approved by ${esc(a.approved_by_email||'a HEARTH lead')} · ${esc(fmtDate(a.approved_at))}</span>`
       :'<span class="empty">Not approved yet.</span>'
    }${isLead?(a?'<button class="btn ghost" type="button" id="unapproveBtn">Remove approval</button>':'<button class="btn primary" type="button" id="approveBtn">Approve stage</button>'):''}</div>
    ${cs.length?cs.map(c=>`<div class="comment"><div class="who"><span><b>${esc(c.author_email||'Member')}</b> · ${esc(fmtDate(c.created_at))}</span>
      ${c.author===me.id?`<button class="btn ghost" type="button" data-delcomment="${c.id}">Delete</button>`:''}</div><p>${esc(c.body)}</p></div>`).join('')
      :'<p class="empty">No notes on this stage yet.</p>'}
    <label for="commentBox" style="position:absolute;left:-9999px">Add a note</label>
    <textarea id="commentBox" rows="3" placeholder="${isLead&&!canEdit?'Leave a coaching note for the writer':'Reply or ask your coach a question'}"></textarea>
    <div class="actions"><button class="btn" type="button" id="postBtn">Post note</button></div></section>`;

  h+=`<div class="pager"><button class="btn" type="button" id="prevBtn" ${stage===0?'disabled':''}>Previous stage</button>
    <button class="btn" type="button" id="nextBtn" ${stage===STAGES.length-1?'disabled':''}>Next stage</button></div>
    <div class="foot"><span>Signed in as ${esc(me.email)}${isLead?' · HEARTH lead':''}</span>
    <span>${canEdit?'<button class="btn ghost danger" type="button" id="deleteBtn">Delete project</button>':''}<button class="btn ghost" type="button" id="signOut">Sign out</button></span></div>`;
  $('#main').innerHTML=h;
}

/* ======================== EVENTS ======================== */
document.addEventListener('input',e=>{
  const t=e.target; if(!P||!canEdit)return;
  if(t.dataset.k){P.data.f[t.dataset.k]=t.value;
    if(t.dataset.k==='title'&&t.value.trim()){P.title=t.value.trim();const x=list.find(y=>y.id===P.id);if(x)x.title=P.title;renderProjects()}}
  else if(t.dataset.g){P.data.g[t.dataset.g][+t.dataset.i][t.dataset.gk]=t.value}
  else return;
  const w=t.closest('.field')?.querySelector('[data-wc]');
  if(w){const f=stageFields(STAGES[stage]).find(x=>x.k===t.dataset.k);if(f&&f.words){const n=wc(t.value);w.textContent=`${n} words · target ${f.words[0]}–${f.words[1]}`;w.className=n>f.words[1]?'warn':''}}
  renderSteps(); scheduleSave();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='projSel'){clearTimeout(saveTimer);if(canEdit&&$('#status').textContent==='Saving…')await saveNow();await openProject(t.value);return}
  if(t.dataset.qa!==undefined&&canEdit){
    const st=STAGES[stage]; P.data.qa[st.id]=P.data.qa[st.id]||[]; P.data.qa[st.id][+t.dataset.qa]=t.checked;
    const b=$('#doneBtn'); if(b) b.disabled=!st.qa.every((_,i)=>P.data.qa[st.id][i]); scheduleSave();
  }
});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t||!P)return; const st=STAGES[stage];
  if(t.dataset.step!==undefined){stage=+t.dataset.step;renderSteps();renderMain();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-toggle-ex')){const ex=t.closest('.field').querySelector('.example');ex.hidden=!ex.hidden;t.textContent=ex.hidden?'Show example':'Hide example';return}
  if(t.dataset.add){P.data.g[t.dataset.add].push({});renderMain();scheduleSave();return}
  if(t.dataset.remove){const arr=P.data.g[t.dataset.remove],it=arr[+t.dataset.i];
    if(Object.values(it).some(filled)&&!confirm('Remove this entry and its text?'))return;
    arr.splice(+t.dataset.i,1);renderMain();renderSteps();scheduleSave();return}
  if(t.id==='doneBtn'){P.data.done[st.id]=true;renderSteps();renderMain();scheduleSave();return}
  if(t.id==='undoneBtn'){P.data.done[st.id]=false;renderSteps();renderMain();scheduleSave();return}
  if(t.id==='approveBtn'){t.disabled=true;const {error}=await sb.from('sb_approvals').insert({project_id:P.id,stage_id:st.id,approved_by:me.id,approved_by_email:me.email});
    if(error)alert('Approval not saved: '+error.message);await loadApprovals();renderSteps();renderMain();return}
  if(t.id==='unapproveBtn'){await sb.from('sb_approvals').delete().eq('project_id',P.id).eq('stage_id',st.id);await loadApprovals();renderSteps();renderMain();return}
  if(t.id==='postBtn'){const body=$('#commentBox').value.trim();if(!body)return;t.disabled=true;
    const {error}=await sb.from('sb_comments').insert({project_id:P.id,stage_id:st.id,body,author:me.id,author_email:me.email});
    if(error){alert('Note not posted: '+error.message);t.disabled=false;return}
    await loadComments();renderMain();return}
  if(t.dataset.delcomment){if(!confirm('Delete this note?'))return;await sb.from('sb_comments').delete().eq('id',t.dataset.delcomment);await loadComments();renderMain();return}
  if(t.id==='prevBtn'){stage--;renderSteps();renderMain();window.scrollTo(0,0);return}
  if(t.id==='nextBtn'){stage++;renderSteps();renderMain();window.scrollTo(0,0);return}
  if(t.id==='newBtn'){$('#newName').value='';$('#newDlg').showModal();return}
  if(t.id==='newCancel'){$('#newDlg').close();return}
  if(t.id==='newCreate'){const name=$('#newName').value.trim(),seed=document.querySelector('input[name=seed]:checked').value;
    $('#newDlg').close();await createProject(name||(seed==='example'?'Study copy: I May Destroy You':'Untitled series'),seed);return}
  if(t.id==='exportBtn')return exportMd();
  if(t.id==='deleteBtn'){if(!confirm(`Delete "${P.title}" and all its notes? This cannot be undone.`))return;
    const {error}=await sb.from('sb_projects').delete().eq('id',P.id);if(error){alert('Project not deleted: '+error.message);return}
    await loadList();if(!list.some(x=>x.owner===me.id)){await createProject('My series','blank',false);await loadList()}
    await openProject((list.find(x=>x.owner===me.id)||list[0]).id);return}
  if(t.id==='signOut'){await sb.auth.signOut();return}
});

/* ======================== EXPORT ======================== */
function toMd(){
  const d=P.data; let md=`# ${P.title}\n\n`;
  STAGES.forEach((st,i)=>{
    md+=`## ${i+1}. ${st.title}${approvals[st.id]?' (approved)':d.done[st.id]?' (complete)':''}\n\n`;
    (st.cards||[]).forEach(c=>{md+=`### ${c.title}\n\n`;c.fields.forEach(f=>{md+=`**${f.label}**\n\n${(d.f[f.k]||'').trim()||'_Not yet written_'}\n\n`})});
    (st.groups||[]).forEach(g=>{md+=`### ${g.title}\n\n`;(d.g[g.k]||[]).forEach((it,j)=>{md+=`#### ${g.item} ${j+1}\n\n`;g.fields.forEach(f=>{md+=`**${f.label}:** ${(it[f.k]||'').trim()||'_Not yet written_'}\n\n`})})});
  });
  return md;
}
function exportMd(){
  const blob=new Blob([toMd()],{type:'text/markdown'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(P.title||'series').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-bible.md';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

start().catch(err=>{
  console.error(err);
  document.body.insertAdjacentHTML('afterbegin',`<div class="banner" style="margin:20px">The Series Builder couldn't start: ${esc(err&&err.message||err)}</div>`);
});
</script>
</body>
